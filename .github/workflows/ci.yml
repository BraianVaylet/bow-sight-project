name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Documentacion con enlaces rotos manda a alguien a una pagina que no esta
      # y le hace dudar del resto.
      - name: Enlaces de la documentacion
        run: pnpm docs:links

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # El build va ANTES de los tests a proposito: los tests de la landing
      # verifican el HTML prerenderizado, que solo existe despues de buildear.
      # Con el orden al reves se saltean en silencio y el SSG queda sin cubrir.
      - name: Build
        run: pnpm build

      # Corre los tests Y aplica el gate de cobertura por criticidad:
      # 95% en dominio, entitlements y billing; 85/70/50 en el resto.
      - name: Test + cobertura
        run: pnpm test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: caminos criticos (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Los E2E levantan la PWA y la landing en modo dev, y la API contra un
      # Mongo efimero en memoria (`e2e/support/api-server.ts`). No hace falta
      # buildear, pero si descargar el navegador.
      - name: Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Publicar reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level=high

  # 🔴 Apagado hasta que exista la infraestructura (F0-20): sin el proyecto de
  # Railway ni el cluster de Atlas, este job falla en cada push a `main` y
  # entrena a todos a ignorar el CI en rojo. Se prende poniendo la variable de
  # repositorio DEPLOY_STAGING en "true".
  deploy-staging:
    name: deploy a staging
    needs: [verify, e2e, audit]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Las migraciones corren ANTES del deploy y desde un solo lugar: si las
      # corriera el arranque del proceso, dos instancias las correrian a la vez.
      - name: Migraciones
        run: pnpm exec migrate-mongo up
        env:
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.STAGING_MONGODB_DB_NAME }}

      - name: Desplegar servicios
        run: |
          npm i -g @railway/cli
          for service in bow-sight-api bow-sight-pwa bow-sight-landing; do
            railway up --service "$service" --environment staging --ci
          done
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke
        run: |
          curl -fsS "${{ secrets.STAGING_API_URL }}/ready" > /dev/null
          curl -fsS "${{ secrets.STAGING_LANDING_URL }}/" > /dev/null
