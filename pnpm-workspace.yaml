packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # Compila un binario nativo. Solo lo usa `scripts/import-sqlite.ts`, la
  # migracion de una sola vez de los datos del autor (F0-21): no entra en el
  # runtime de la API ni en la imagen de produccion.
  better-sqlite3: true
  esbuild: true
  mongodb-memory-server: true
  # MSW instala el service worker para mockear en el navegador.
  msw: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - mongodb-memory-server
  - msw
